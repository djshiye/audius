# Installed by Audius: keep the boot-time sound restore from overriding the Babyface volume knob.
# It resets the Babyface's saved output volumes to the driver's "never written" placeholder,
# once per boot only (see /usr/libexec/audius/keep-knob-volumes). The leading "-" means it can
# never stop sound settings from being restored.
[Service]
ExecStartPre=-/usr/libexec/audius/keep-knob-volumes --boot
