# Installed by Audius: keep the next boot's sound restore from overriding the Babyface volume knob.
# alsa-store saves the sound state at shutdown on systems without the alsa-state daemon; right
# after that, the Babyface's saved output volumes go back to the driver's "never written"
# placeholder (see /usr/libexec/audius/keep-knob-volumes). The leading "-" means it can never
# make the save fail.
[Service]
ExecStartPost=-/usr/libexec/audius/keep-knob-volumes --shutdown
