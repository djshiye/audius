# Installed by Audius: keep the next boot's sound restore from overriding the Babyface volume knob.
# Right after the shutdown save, the Babyface's saved output volumes go back to the driver's
# "never written" placeholder. Only while the system is shutting down: on a restart mid-session
# it does nothing (see /usr/libexec/audius/keep-knob-volumes). The leading "-" means it can never
# make stopping the service fail.
[Service]
ExecStopPost=-/usr/libexec/audius/keep-knob-volumes --shutdown
